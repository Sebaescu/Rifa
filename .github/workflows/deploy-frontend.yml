# Nuevo workflow para deploy Angular en GitHub Pages
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Create environment.prod.ts
        run: |
          echo "export const environment = {
            production: true,
            apiUrl: '${{ secrets.API_URL }}',
            locationApiKey: '${{ secrets.LOCATION_API_KEY }}',
            supabaseUrl: '${{ secrets.SUPABASE_URL }}',
            supabaseAnonKey: '${{ secrets.SUPABASE_ANON_KEY }}'
          };" > frontend/src/environments/environment.prod.ts

      - name: Print [environment.prod.ts](http://_vscodecontentref_/2)
        run: cat [environment.prod.ts](http://_vscodecontentref_/3)

      - name: Build Angular app
        run: npm run build -- --configuration=production --base-href=/Rifa/
        working-directory: frontend

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

