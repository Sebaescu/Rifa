
# Workflow fusionado para CI/CD y deploy a GitHub Pages
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create environment file
        working-directory: ./frontend
        run: |
          echo "export const environment = {
            production: true,
            apiUrl: '${{ secrets.API_URL }}',
            locationApiKey: '${{ secrets.LOCATION_API_KEY }}',
            supabaseUrl: 'https://miwsqcmlcltoyxeknpsr.supabase.co',
            supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pd3NxY21sY2x0b3l4ZWtucHNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM3MDQwMTcsImV4cCI6MjA2OTI4MDAxN30._rVgx6Jp1DifpX5sxLmVFiwJh4k3wNJPRcbD778AFgM'
          };" > src/environments/environment.prod.ts

      - name: Build for production
        working-directory: ./frontend
        run: npm run build -- --configuration=production

      - name: List build output
        working-directory: ./frontend
        run: ls -la dist/frontend/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist/frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
