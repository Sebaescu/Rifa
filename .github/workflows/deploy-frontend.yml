name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: 
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths: 
      - 'frontend/**'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Create environment file
      run: |
        echo "export const environment = {
          production: true,
          apiUrl: '${{ secrets.API_URL }}',
          locationApiKey: '${{ secrets.LOCATION_API_KEY }}',
          supabaseUrl: 'https://miwsqcmlcltoyxeknpsr.supabase.co',
          supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pd3NxY21sY2x0b3l4ZWtucHNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM3MDQwMTcsImV4cCI6MjA2OTI4MDAxN30._rVgx6Jp1DifpX5sxLmVFiwJh4k3wNJPRcbD778AFgM'
        };" > src/environments/environment.prod.ts

    - name: Build
      run: npm run build --if-present

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './frontend/dist/rifa-frontend'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
