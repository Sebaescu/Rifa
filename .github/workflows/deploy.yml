# Workflow para CI/CD con GitHub Pages - Versión corregida
name: Deploy to GitHub Pages

# Ejecutar cuando:
on:
  # Cuando se hace push a main
  push:
    branches: [ main ]
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

# Configurar permisos para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar ejecuciones concurrentes
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Build (sin tests ni lint por ahora)
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout del código
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 2. Configurar Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    # 3. Instalar dependencias
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    # 4. Build para producción con base-href para GitHub Pages
    - name: Build for production
      working-directory: ./frontend
      run: npm run build:github
      env:
        # Variables de entorno para producción
        LOCATION_API_KEY: ${{ secrets.LOCATION_API_KEY }}
    
    # 5. Verificar que el build se generó correctamente
    - name: List build output
      working-directory: ./frontend
      run: ls -la dist/frontend/browser/
    
    # 6. Subir artefactos del build
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-files
        path: frontend/dist/frontend/browser/
        retention-days: 1

  # Job 2: Deploy a GitHub Pages (solo en main)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    # 1. Descargar artefactos del build
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-files
        path: ./dist
    
    # 2. Configurar Pages
    - name: Setup Pages
      uses: actions/configure-pages@v4
    
    # 3. Subir a Pages
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist
    
    # 4. Deploy a Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
