version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: rifa_postgres
    environment:
      POSTGRES_DB: rifa_system
      POSTGRES_USER: rifa_user
      POSTGRES_PASSWORD: rifa_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped

volumes:
  postgres_data:
